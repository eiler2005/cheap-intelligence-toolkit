name: Нет моей профессии
description: В каталоге профессий нет вашей роли — расскажите о ней
labels: ["профессии"]
body:
  - type: markdown
    attributes:
      value: |
        Каталог растёт по запросам. Чем конкретнее вы опишете свою неделю, тем выше шанс, что
        разбор появится и окажется правдой, а не общими словами.
  - type: input
    id: role
    attributes:
      label: Профессия
      placeholder: логист-диспетчер
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Пять-десять реальных задач вашей недели
      description: Конкретных: «сверил накладные с реестром», а не «работал с документами».
    validations:
      required: true
  - type: textarea
    id: hard
    attributes:
      label: Что в вашей работе ИИ точно не сделает — и почему
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка перед отправкой
      options:
        - label: В тексте нет персональных данных, коммерческой тайны и материалов под NDA
          required: true
